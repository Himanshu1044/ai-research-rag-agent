services:
  frontend:
    build:
      context: ./frontend
    container_name: ai-research-frontend
    ports:
      - "5173:80"
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - research-network

  backend:
    build: .
    container_name: ai-research-backend
    ports:
      - "5000:5000"
    env_file:
      - .env
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - research-network

  worker:
    build: .
    container_name: ai-research-worker
    env_file:
      - .env
    depends_on:
      redis:
        condition: service_healthy
    command: node src/workers/researchWorker.js
    restart: unless-stopped
    networks:
      - research-network

  redis:
    image: redis:7
    container_name: research-redis
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - research-network

networks:
  research-network:
